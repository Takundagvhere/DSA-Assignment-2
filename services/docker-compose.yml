# Shared settings for all 7 Ballerina services (a YAML "anchor")
x-ballerina-service: &ballerina-service
  restart: on-failure
  depends_on:
    kafka:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
    mongo:
      condition: service_started
  # Inside Docker, services find Kafka and MongoDB by container name
  command: ["-CkafkaBootstrap=kafka:9092", "-CmongoUrl=mongodb://mongo:27017"]

services:

  # ================= INFRASTRUCTURE =================

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in orders.created payments.completed payments.failed orders.status-changed kitchen.updates delivery.assigned delivery.completed; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
        echo "All topics created"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: food-delivery
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  mongo-express:
    image: mongo-express:latest
    ports:
      - "8091:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongo

  # ================= MICROSERVICES =================

  customer-service:
    <<: *ballerina-service
    build: ./services/customer-service
    ports:
      - "8081:8081"

  restaurant-service:
    <<: *ballerina-service
    build: ./services/restaurant-service
    ports:
      - "8082:8082"

  order-service:
    <<: *ballerina-service
    build: ./services/order-service
    ports:
      - "8083:8083"

  payment-service:
    <<: *ballerina-service
    build: ./services/payment-service
    ports:
      - "8084:8084"

  delivery-service:
    <<: *ballerina-service
    build: ./services/delivery-service
    ports:
      - "8085:8085"

  notification-service:
    <<: *ballerina-service
    build: ./services/notification-service
    ports:
      - "8086:8086"

  admin-service:
    <<: *ballerina-service
    build: ./services/admin-service
    ports:
      - "8087:8087"

volumes:
  mongo-data: